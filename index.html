<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NPI HUB</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,"Segoe UI",system-ui,sans-serif;background:#0b1020;color:#e2e8f0;display:flex;flex-direction:column;overflow:hidden}
.hub-hdr{flex:0 0 auto;display:flex;align-items:center;gap:28px;padding:0 20px;height:52px;background:#0f172a;border-bottom:1px solid #1e293b}
.hub-title{font-size:20px;font-weight:800;letter-spacing:.06em;color:#fff;white-space:nowrap}
.hub-tabs{display:flex;gap:4px;height:100%;align-items:flex-end;overflow-x:auto}
.hub-tab{appearance:none;border:0;background:transparent;color:#94a3b8;font:600 13.5px "Segoe UI",system-ui,sans-serif;padding:0 18px;height:44px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.hub-tab:hover{color:#e2e8f0;background:#16213a}
.hub-tab.active{color:#fff;border-bottom-color:#6366f1;background:#16213a}
.hub-body{flex:1 1 auto;position:relative;min-height:0}
.hub-frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;display:none}
.hub-frame.active{display:block}
</style>
</head>
<body>
<header class="hub-hdr">
<div class="hub-title">NPI HUB</div>
<nav class="hub-tabs" id="hubTabs"></nav>
</header>
<main class="hub-body" id="hubBody"></main>
<script>
/* Tab registry. Generated by Build-Hub.ps1 from hub-tabs.json - do not edit by hand. */
var HUB_TABS=[{"id":"ess-installs","label":"NPI INSTALLS (ESS)","src":"ess-installs.html"},{"id":"daily-npi-eo-orders","label":"DAILY NPI EO TRACKER","src":"daily-npi-eo-orders.html","default":true}];
(function(){
'use strict';
var nav=document.getElementById('hubTabs'),body=document.getElementById('hubBody');
var frames={},btns={};
function show(id){
 if(!frames[id]){ var d=HUB_TABS.filter(function(x){return x.default})[0]||HUB_TABS[0]; id=d?d.id:''; }
 Object.keys(frames).forEach(function(k){
  var on=(k===id);
  frames[k].classList.toggle('active',on);
  btns[k].classList.toggle('active',on);
  if(on && !frames[k].getAttribute('src')) frames[k].setAttribute('src',frames[k].getAttribute('data-src'));
 });
 try{ history.replaceState(null,'','#'+id); }catch(e){}
 var t=HUB_TABS.filter(function(x){return x.id===id})[0];
 document.title='NPI HUB'+(t?' - '+t.label:'');
}
HUB_TABS.forEach(function(t){
 var b=document.createElement('button');
 b.type='button';b.className='hub-tab';b.textContent=t.label;
 b.addEventListener('click',function(){show(t.id)});
 nav.appendChild(b);btns[t.id]=b;
 var f=document.createElement('iframe');
 f.className='hub-frame';f.id='frame-'+t.id;f.title=t.label;
 f.setAttribute('data-src',t.src);
 body.appendChild(f);frames[t.id]=f;
});
show(decodeURIComponent(location.hash.replace(/^#/,'')));
window.addEventListener('hashchange',function(){show(decodeURIComponent(location.hash.replace(/^#/,'')))});
})();
</script>
</body>
</html>
